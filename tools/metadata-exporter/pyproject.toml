[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "launchpad-metadata"
version = "0.1.0"
description = "Source-only Launchpad field catalog exporter for launchpad-openapi"
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-3.0-only"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "asttokens>=3.0.0,<4",
    "platformdirs>=4.3,<5",
]

[project.scripts]
launchpad-metadata-export = "launchpad_metadata.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/launchpad_metadata"]
exclude = ["test_*.py"]

[tool.pytest.ini_options]
testpaths = ["src/launchpad_metadata", "src/testing/integration"]
pythonpath = ["testing"]

[tool.ruff]
target-version = "py39"
include = [
    "src/**/*.py",
    "testing/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
