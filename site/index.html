<!doctype html>
<!--
  Standalone Launchpad OpenAPI reference.

  An HTML page meant to be dropped onto any static file server alongside
  assets/launchpad-favicon.png for the favicon. The OpenAPI 3.0.3 documents for
  each Launchpad environment are pre-generated from WADL (using
  @canonical/launchpad-openapi) and embedded directly in this file, so no API
  fetch is required at load time. Rendered with Scalar's API reference, themed
  to match Canonical's Vanilla design system (light + dark).

  This file is the page template. site/build.mjs embeds both generated specs
  and writes the deployable page to site/dist/index.html.

  Query parameters:
    ?theme=dark|light   initial colour scheme (default: system preference)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launchpad API reference</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/launchpad-favicon.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---- Canonical / Vanilla theming for Scalar ------------------------ */
      :root {
        --scalar-font: "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Cantarell, "Helvetica Neue", Arial, sans-serif;
        --scalar-font-code: "Ubuntu Mono", "Cascadia Code", Consolas, monospace;
        --scalar-radius: 0.125rem;
        --scalar-radius-lg: 0.1875rem;
        --scalar-radius-xl: 0.25rem;
        --scalar-custom-header-height: 3rem;

        /* Canonical global-nav palette (dark in every colour scheme) */
        --canonical-nav-bg: #2c2c2c;
        --canonical-nav-fg: #fff;
        --canonical-accent: #e95420;
      }

      /* Light theme — Vanilla light tokens */
      .light-mode {
        --scalar-background-1: #ffffff;
        --scalar-background-2: #f7f7f7;
        --scalar-background-3: #ebebeb;
        --scalar-background-accent: rgba(0, 102, 204, 0.08);

        --scalar-color-1: #000000;
        --scalar-color-2: rgba(0, 0, 0, 0.65);
        --scalar-color-3: rgba(0, 0, 0, 0.45);

        --scalar-color-accent: #0066cc;
        --scalar-border-color: rgba(0, 0, 0, 0.12);

        --scalar-link-color: #0066cc;
        --scalar-link-color-hover: #004d99;

        --scalar-color-green: #0e8420;
        --scalar-color-red: #c7162b;
        --scalar-color-yellow: #cc7900;
        --scalar-color-orange: #cc7900;
        --scalar-color-blue: #24598f;
        --scalar-color-purple: #7d42b8;

        --scalar-button-1: #262626;
        --scalar-button-1-hover: #000000;
        --scalar-button-1-color: #ffffff;

        --scalar-sidebar-background-1: #f7f7f7;
        --scalar-sidebar-color-1: #000000;
        --scalar-sidebar-color-2: rgba(0, 0, 0, 0.65);
        --scalar-sidebar-border-color: rgba(0, 0, 0, 0.12);
        --scalar-sidebar-item-hover-background: #ebebeb;
        --scalar-sidebar-item-hover-color: #000000;
        --scalar-sidebar-item-active-background: #e0e0e0;
        --scalar-sidebar-color-active: #0066cc;
        --scalar-sidebar-search-background: #ffffff;
        --scalar-sidebar-search-border-color: rgba(0, 0, 0, 0.12);
        --scalar-sidebar-search-color: rgba(0, 0, 0, 0.45);
      }

      /* Dark theme — Vanilla dark tokens */
      .dark-mode {
        --scalar-background-1: #262626;
        --scalar-background-2: #202020;
        --scalar-background-3: #313131;
        --scalar-background-accent: rgba(102, 153, 204, 0.14);

        --scalar-color-1: #ffffff;
        --scalar-color-2: rgba(255, 255, 255, 0.65);
        --scalar-color-3: rgba(255, 255, 255, 0.45);

        --scalar-color-accent: #6699cc;
        --scalar-border-color: rgba(255, 255, 255, 0.15);

        --scalar-link-color: #6699cc;
        --scalar-link-color-hover: #99ccff;

        --scalar-color-green: #62a36c;
        --scalar-color-red: #d17b85;
        --scalar-color-yellow: #c48831;
        --scalar-color-orange: #c48831;
        --scalar-color-blue: #79a9d6;
        --scalar-color-purple: #a679d2;

        --scalar-button-1: #f7f7f7;
        --scalar-button-1-hover: #ffffff;
        --scalar-button-1-color: #262626;

        --scalar-sidebar-background-1: #202020;
        --scalar-sidebar-color-1: #ffffff;
        --scalar-sidebar-color-2: rgba(255, 255, 255, 0.65);
        --scalar-sidebar-border-color: rgba(255, 255, 255, 0.15);
        --scalar-sidebar-item-hover-background: #313131;
        --scalar-sidebar-item-hover-color: #ffffff;
        --scalar-sidebar-item-active-background: #373737;
        --scalar-sidebar-color-active: #6699cc;
        --scalar-sidebar-search-background: #2f2f2f;
        --scalar-sidebar-search-border-color: rgba(255, 255, 255, 0.15);
        --scalar-sidebar-search-color: rgba(255, 255, 255, 0.45);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--scalar-background-1, #fff);
        font-family: var(--scalar-font);
      }

      /* Some Scalar code/example blocks and the interactive request editor
         inherit the sans base font; force the monospace family on every code
         surface (rendered highlight blocks and CodeMirror editors). */
      #app pre,
      #app code,
      #app kbd,
      #app samp,
      #app .scalar-code-block,
      #app .scalar-code-block *,
      #app .cm-editor,
      #app .cm-editor .cm-scroller,
      #app .cm-editor .cm-content,
      #app .cm-editor .cm-line {
        font-family: var(--scalar-font-code) !important;
      }

      /* ---- Canonical global navigation bar ------------------------------- */
      .lp-header {
        position: sticky;
        top: 0;
        z-index: 40;
        height: var(--scalar-custom-header-height);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0 1rem;
        background: var(--canonical-nav-bg);
        color: var(--canonical-nav-fg);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-family: var(--scalar-font);
      }
      .lp-header__logo {
        height: 1.75rem;
        width: auto;
        display: block;
        border-radius: 2px;
      }
      .lp-header__title {
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: 0;
        color: #fff;
      }
      .lp-header__title b {
        font-weight: 500;
      }
      .lp-header__spacer {
        flex: 1;
      }
      .lp-header__link {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: none;
        font-size: 0.8125rem;
        padding: 0.35rem 0.6rem;
        border-radius: 2px;
        border-bottom: 2px solid transparent;
      }
      .lp-header__link:hover {
        color: #fff;
        border-bottom-color: var(--canonical-accent);
      }

      /* ---- Loading / error overlays ------------------------------------- */
      .lp-overlay {
        position: fixed;
        inset: var(--scalar-custom-header-height) 0 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        padding: 2rem;
        background: var(--scalar-background-1, #fff);
        color: var(--scalar-color-1, #000);
        z-index: 30;
      }
      .lp-overlay[hidden] {
        display: none;
      }
      .lp-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid rgba(233, 84, 32, 0.25);
        border-top-color: var(--canonical-accent);
        border-radius: 50%;
        animation: lp-spin 0.8s linear infinite;
      }
      @keyframes lp-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .lp-status {
        font-size: 0.9rem;
        color: var(--scalar-color-2, rgba(0, 0, 0, 0.65));
      }
      .lp-error {
        max-width: 40rem;
        width: 100%;
        border: 1px solid var(--scalar-color-red, #c7162b);
        border-left-width: 3px;
        background: rgba(199, 22, 43, 0.06);
        border-radius: 3px;
        padding: 1.25rem 1.5rem;
      }
      .lp-error h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
        font-weight: 500;
      }
      .lp-error p {
        margin: 0.4rem 0;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .lp-error pre {
        display: block;
        padding: 0.6rem 0.8rem;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--scalar-font-code);
        background: var(--scalar-background-3, rgba(0, 0, 0, 0.06));
        border-radius: 2px;
        font-size: 0.82em;
        color: var(--scalar-color-2, rgba(0, 0, 0, 0.7));
      }
      /* Worker-backed search uses a native modal for focus trapping and Escape. */
      .lp-search-trigger { display: flex; flex-shrink: 0; min-width: 0; padding: 0.75rem 0.75rem 0; }
      .lp-search-trigger--inline { flex: 1; padding: 0; }
      .lp-search-trigger[hidden], .lp-mobile-search[hidden] { display: none; }
      .lp-sidebar-search {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        width: 100%;
        min-width: 0;
        height: 2rem;
        padding: 0 0.5rem;
        color: var(--scalar-sidebar-search-color, #666);
        background: var(--scalar-sidebar-search-background, #fff);
        border: 1px solid var(--scalar-sidebar-search-border-color, #aaa);
        border-radius: var(--scalar-radius, 2px);
        cursor: text;
        font: inherit;
        font-size: 0.875rem;
        text-align: left;
      }
      .lp-sidebar-search > svg { width: 1rem; height: 1rem; flex-shrink: 0; }
      .lp-search-trigger__label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
      .lp-search-trigger__shortcut { display: flex; gap: 0.2rem; color: var(--scalar-sidebar-color-2, #666); }
      .lp-search-trigger kbd {
        padding: 0.1rem 0.25rem;
        border: 1px solid var(--scalar-sidebar-search-border-color, #aaa);
        border-radius: 2px;
        font-family: var(--scalar-font-code);
        font-size: 0.6875rem;
        line-height: 1rem;
      }
      .lp-sidebar-search:disabled { opacity: 0.5; cursor: wait; }
      .lp-sidebar-search:focus-visible, .lp-search button:focus-visible,
      .lp-search input:focus-visible { outline: 2px solid var(--canonical-accent); outline-offset: 2px; }
      .lp-search {
        position: fixed;
        inset: 12vh 0 auto;
        margin: 0 auto;
        width: min(540px, calc(100vw - 24px));
        max-height: 70vh;
        padding: 0;
        border: 1px solid var(--scalar-border-color, #aaa);
        border-radius: 4px;
        background: var(--scalar-background-1, #fff);
        color: var(--scalar-color-1, #000);
        font-family: var(--scalar-font);
      }
      .lp-search::backdrop { background: rgb(0 0 0 / 45%); }
      .lp-search__form { display: flex; gap: 0.75rem; padding: 1rem; }
      .lp-search input {
        width: 100%; min-width: 0; padding: 0.4rem;
        border: 1px solid var(--scalar-border-color, #aaa);
        background: var(--scalar-background-1, #fff); color: inherit; font: inherit;
      }
      .lp-search button { background: transparent; color: inherit; border: 0; cursor: pointer; font: inherit; }
      .lp-search__results { max-height: 50vh; overflow-y: auto; padding: 0 0.5rem; }
      .lp-search__results a { display: block; padding: 0.6rem; color: inherit; text-decoration: none; border-radius: 3px; }
      .lp-search__results a:hover, .lp-search__results [aria-selected="true"] { background: var(--scalar-background-2, #eee); }
      .lp-search__results strong, .lp-search__results span { display: block; overflow-wrap: anywhere; }
      .lp-search__results span { margin-top: 0.2rem; color: var(--scalar-color-2, #666); font-size: 0.8rem; }
      .lp-search__status { padding: 0.75rem 1rem; font-size: 0.8rem; }
      @media (max-width: 1023px) {
        :root { --scalar-custom-header-height: 6rem; }
        .lp-header { height: 3rem; }
        .lp-mobile-search {
          position: sticky; top: 3rem; z-index: 39; height: 3rem;
          background: var(--scalar-sidebar-background-1, #f7f7f7);
          border-bottom: 1px solid var(--scalar-sidebar-border-color, #aaa);
        }
        .lp-mobile-search .lp-search-trigger { padding: 0.5rem 0.75rem; }
      }
      @media (max-width: 600px) { .lp-header__link { display: none; } }
    </style>
  </head>
  <body>
    <header class="lp-header">
      <svg class="lp-header__logo" viewBox="0 0 233 400" aria-hidden="true">
        <rect width="233" height="400" fill="#e95420"></rect>
        <path
          fill="#fff"
          d="M42.06808,238.40737l8.14405-12.1682c.75612-1.10637,1.23227-1.13109,2.05125-.73948,17.94034,10.3328,34.02466,11.80606,50.61464,4.6327,16.49523-7.13059,26.41246-19.74457,31.1949-39.63742.509-1.79215,1.16561-1.7855,1.62414-1.72229l14.24543,3.09005c2.40789.60024,2.31837,1.26178,2.25266,1.74463-3.15353,23.30939-19.33689,43.79155-42.24346,53.45615-23.27893,9.99347-48.56672,7.79404-67.66077-5.87689-.38235-.34218-1.27084-1.24324-.22284-2.77924ZM113.06095,356.07829l14.60301.79461c2.45407.04848,2.52407-.60451,2.58882-1.08736,3.15401-23.30987-7.00653-47.34306-26.51626-62.72012-19.79542-15.80383-44.76229-20.3776-66.80752-12.25089-.45948.22812-1.55558.8602-.95706,2.6072l4.62198,13.89905c.43615,1.26796.88516,1.42194,1.78175,1.2575,20.04445-5.21155,35.94306-2.37338,50.03326,8.93272,14.00926,11.24242,20.21919,26.03018,19.54306,46.53799.01571,1.80593.6528,1.96562,1.10895,2.0293ZM122.42299,258.93419c-.66089-.0884-1.3175-.13307-1.96697-.13307-2.95927,0-5.7614.91437-8.04597,2.65282-2.78642,2.11865-4.59341,5.30375-5.08908,8.96789-.48186,3.55959.42187,7.07356,2.54406,9.89272,2.146,2.85053,5.32954,4.68973,8.96398,5.18018,7.34079.98471,14.11115-4.16506,15.10202-11.4867,1.00753-7.44711-4.04774-14.06823-11.50805-15.07385ZM195.36521,234.45997l-6.78036-12.95616c-.96706-2.13195-1.73033-1.92665-2.53073-1.65481-21.67526,9.32718-36.63538,29.84735-40.02556,54.90518-3.39256,25.07683,5.59666,48.84199,24.04648,63.57081.41377.36214.82517.49711,1.27941.46194.52662-.04562,1.06419-.33647,1.40273-.75944l9.52822-11.40876c.87849-1.10257.50424-1.66431.04523-2.14431-14.94584-14.68986-20.54012-29.27801-18.10604-47.26797,2.44741-18.08882,12.00467-31.05828,30.07738-40.81413,1.4294-.85829,1.19942-1.60633,1.06324-1.93235Z"
        ></path>
      </svg>
      <span class="lp-header__title"><b>Launchpad</b>&nbsp;API</span>
      <span class="lp-header__spacer"></span>
      <a
        class="lp-header__link"
        href="https://launchpad.net/+apidoc/"
        target="_blank"
        rel="noreferrer"
        >Launchpad API docs</a
      >
      <a
        class="lp-header__link"
        href="https://www.npmjs.com/package/@canonical/launchpad-openapi"
        target="_blank"
        rel="noreferrer"
        >npm package</a
      >
    </header>

    <div id="lp-mobile-search" class="lp-mobile-search" hidden></div>
    <main id="app"></main>

    <div id="lp-search-trigger" class="lp-search-trigger" hidden>
      <button id="lp-open-search" class="lp-sidebar-search" type="button"
        aria-label="Open Search" aria-haspopup="dialog" aria-controls="lp-search" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="7"></circle><path d="m16 16 5 5"></path>
        </svg>
        <span class="lp-search-trigger__label" aria-hidden="true">Search…</span>
        <span class="lp-search-trigger__shortcut" aria-hidden="true"><kbd id="lp-search-modifier">Ctrl</kbd><kbd>K</kbd></span>
      </button>
    </div>

    <dialog id="lp-search" class="lp-search" aria-label="Search">
      <div class="lp-search__form">
        <input id="lp-search-query" type="search" role="combobox"
          aria-label="Enter search query" aria-autocomplete="list"
          aria-controls="lp-search-results" aria-expanded="true"
          autocomplete="off" spellcheck="false" placeholder="Search…" />
        <button id="lp-close-search" type="button" aria-label="Close search">✕</button>
      </div>
      <div id="lp-search-results" class="lp-search__results" role="listbox"
        aria-label="Reference Search Results"></div>
      <div id="lp-search-status" class="lp-search__status" role="status" aria-live="polite"></div>
    </dialog>

    <div class="lp-overlay" id="loading">
      <div class="lp-spinner"></div>
      <div class="lp-status" id="status">Rendering API reference…</div>
    </div>

    <div class="lp-overlay" id="error-overlay" hidden>
      <div class="lp-error">
        <h1>Could not render the API reference</h1>
        <p id="error-message"></p>
        <p id="error-detail"></p>
      </div>
    </div>

    <!-- Embedded, pre-generated OpenAPI documents -->
    <script id="spec-production" type="application/json"></script>
    <script id="spec-qastaging" type="application/json"></script>
    <script id="lp-search-worker" type="text/plain"><!-- SEARCH_WORKER --></script>
    <script><!-- SEARCH_UI --></script>

    <script>
      (function () {
        var SCALAR_SRC =
          "https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.73.1";
        var params = new URLSearchParams(location.search);
        var prefersDark =
          params.get("theme") === "dark"
            ? true
            : params.get("theme") === "light"
              ? false
              : (window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches) ||
                false;
        document.documentElement.classList.add(
          prefersDark ? "dark-mode" : "light-mode",
        );

        function readSpec(id) {
          return JSON.parse(document.getElementById(id).textContent);
        }

        var sidebarRoot;
        var sidebarObserver;
        var sidebarFrame;

        // Scalar selects and expands search targets, but its direct-navigation
        // handler does not reveal the selected entry in the sidebar viewport.
        // Scroll only that viewport: scrollIntoView can also move the document.
        /** @note Impure — reveals the selected entry in its sidebar scroll viewport. */
        function revealSidebarSelection() {
          sidebarFrame = undefined;
          var active = sidebarRoot.querySelector('[aria-current="page"]');
          if (!active) return;
          var viewport = active.parentElement;
          while (viewport && viewport !== sidebarRoot) {
            if (/auto|scroll/.test(getComputedStyle(viewport).overflowY)) break;
            viewport = viewport.parentElement;
          }
          if (!viewport || viewport === sidebarRoot) return;
          var item = active.getBoundingClientRect();
          var bounds = viewport.getBoundingClientRect();
          if (item.top < bounds.top) {
            viewport.scrollTop += item.top - bounds.top;
          } else if (item.bottom > bounds.bottom) {
            viewport.scrollTop += item.bottom - bounds.bottom;
          }
        }

        /** @note Impure — batches sidebar DOM changes into one animation frame. */
        function scheduleSidebarReveal() {
          if (sidebarFrame !== undefined) return;
          sidebarFrame = requestAnimationFrame(revealSidebarSelection);
        }

        /** @note Impure — observes Scalar's sidebar after its initial lazy load. */
        function syncSidebarSelection() {
          var sidebar = document.querySelector("#app aside");
          if (!sidebar || sidebar === sidebarRoot) return;
          if (sidebarObserver) sidebarObserver.disconnect();
          sidebarRoot = sidebar;
          sidebarObserver = new MutationObserver(scheduleSidebarReveal);
          sidebarObserver.observe(sidebar, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["aria-current"],
          });
          scheduleSidebarReveal();
        }

        function fail(message, detail) {
          document.getElementById("loading").hidden = true;
          document.getElementById("error-message").textContent = message;
          document.getElementById("error-detail").innerHTML = detail
            ? "<pre>" +
              String(detail).replace(/&/g, "&amp;").replace(/</g, "&lt;") +
              "</pre>"
            : "";
          document.getElementById("error-overlay").hidden = false;
        }

        function loadScalar() {
          return new Promise(function (resolve, reject) {
            if (window.Scalar && window.Scalar.createApiReference) {
              resolve();
              return;
            }
            var script = document.createElement("script");
            script.src = SCALAR_SRC;
            script.onload = resolve;
            script.onerror = function () {
              reject(new Error("Failed to load Scalar from the CDN"));
            };
            document.head.appendChild(script);
          });
        }

        var search = LaunchpadSearch.default();
        window.addEventListener("pagehide", function (event) {
          if (!event.persisted) search.destroy();
        });

        loadScalar()
          .then(function () {
            var sources = [
              {
                slug: "production",
                title: "Production",
                content: readSpec("spec-production"),
                default: true,
              },
              {
                slug: "qastaging",
                title: "QA staging",
                content: readSpec("spec-qastaging"),
              },
            ];
            document.getElementById("loading").hidden = true;
            window.Scalar.createApiReference("#app", {
              sources: sources,
              hideSearch: true,
              onDocumentSelect: search.pause,
              onLoaded: function (slug) {
                syncSidebarSelection();
                search.setEnvironment(slug);
              },
              proxyUrl: "https://proxy.scalar.com",
              theme: "none",
              layout: "modern",
              darkMode: prefersDark,
              hideDarkModeToggle: false,
              hideModels: false,
              documentDownloadType: "both",
              metaData: {
                title: "Launchpad API reference",
                description:
                  "Launchpad web-service API, converted from WADL.",
              },
            });
          })
          .catch(function (cause) {
            fail(
              "The Scalar UI could not be loaded.",
              (cause && cause.message) || String(cause),
            );
          });
      })();
    </script>
  </body>
</html>
