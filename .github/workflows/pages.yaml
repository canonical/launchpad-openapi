name: Deploy API reference to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "12.6.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate specs and build the static reference
        run: |
          set -euo pipefail
          rm -rf site/dist
          mkdir -p site/dist/assets
          node dist/index.js --format json --output site/dist/production.json
          node dist/index.js --environment qastaging --format json --output site/dist/qastaging.json
          pnpm build:site site/dist/production.json site/dist/qastaging.json
          cp assets/launchpad-favicon.png site/dist/assets/
          touch site/dist/.nojekyll
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
